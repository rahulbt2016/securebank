spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:postgresql://localhost:5432/securebank
    username: securebank
    password: securebank_dev
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  flyway:
    # Each service owns its own schema history table so migrations don't collide
    # in the shared securebank database.
    table: flyway_auth_schema_history

server:
  port: 8082

jwt:
  secret: securebank-jwt-secret-key-for-development-use-only-change-in-production!
  access-token-expiry-ms: 900000      # 15 minutes
  refresh-token-expiry-days: 7

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.securebank: DEBUG
    org.hibernate.SQL: WARN
